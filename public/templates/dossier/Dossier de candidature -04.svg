  <text class="uuid-7b8dd67f-f5a0-434e-b2d1-d4aafbc3841f" transform="translate(20.29 447.14)"><tspan x="0" y="0">Les photos prises lors des activités pédagogiques, peuvent être utilisées pour le contenu</tspan><tspan x="0" y="14.4">audiovisuel de l’université. </tspan></text>
  <text class="uuid-cacbe34a-81cc-4485-a946-9379c30f7b61" transform="translate(231.56 363.63)"><tspan x="0" y="0" xml:space="preserve">Photocopies légalisées des relevés de notes de L1, L2 et L3  </tspan></text>
  <text class="uuid-d84bd398-c043-44fd-96fa-a89cd7aaa3db" transform="translate(20.43 539.62)"><tspan x="0" y="0">Je soussigné (e), Mme, Mlle, M. .............................................................................................................</tspan></text>
  <text class="uuid-755c4ee0-4bef-4aae-ae9c-a46b38adde96" transform="translate(20.43 675.7)"><tspan class="uuid-3baa0461-1fd7-4981-8954-571fbc53eaa0" x="0" y="0">Par suite, je demande mon inscription à </tspan><tspan class="uuid-0101181c-dee5-4207-abfc-ac60b3f555f1" x="233.37" y="0">AFI-L’Université de l’Entreprise</tspan><tspan class="uuid-3baa0461-1fd7-4981-8954-571fbc53eaa0" x="405.18" y="0">. </tspan></text>
  <text class="uuid-7b8dd67f-f5a0-434e-b2d1-d4aafbc3841f" transform="translate(18.64 737.74)"><tspan x="0" y="0">Fait à ................................, le .............................</tspan></text>
  <text class="uuid-7b8dd67f-f5a0-434e-b2d1-d4aafbc3841f" transform="translate(404.02 737.74)"><tspan x="0" y="0">Signature</tspan><tspan x="-96.24" y="14.4">Précédée de la mention « lu et approuvé »</tspan></text>
  <text class="uuid-d84bd398-c043-44fd-96fa-a89cd7aaa3db" transform="translate(45.06 571.79)"><tspan x="0" y="0">Atteste sur l’honneur de l’exactitude des renseignements et des pièces fournies et </tspan><tspan class="uuid-d32ccc6b-79ee-43bd-b408-f5381a4e5a64" x="478.17" y="0">	</tspan><tspan class="uuid-f4214306-54aa-4c88-a052-0f1cba50924b" x="504" y="0">	</tspan><tspan x="0" y="14.4">m’engage à prévenir l’établissement de tout changement éventuel (adresse, problème </tspan><tspan x="0" y="28.8">de santé, situation familiale ...).</tspan></text>
  <text class="uuid-d84bd398-c043-44fd-96fa-a89cd7aaa3db" transform="translate(45.06 630.58)"><tspan x="0" y="0">Reconnais avoir pris connaissance des réglements intérieur et financier dont j’approuve </tspan><tspan x="0" y="14.4">les contenus et m’engage à m’y conformer.</tspan></text>
  <rect class="uuid-7f475f3d-6434-4d87-957d-c4450f53a72a" x="36.42" y="562.96" width="5.97" height="5.97"/>
